; Windows 导出预设。本文件是提交进仓库的，这样任何人 clone 下来都能直接
; `powershell -File scripts\build.ps1` 打出一模一样的 exe，不必先在编辑器里配一遍。
;
; 未列出的选项一律取 Godot 的平台默认值。

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; 测试、截图工具、文档、构建脚本都不该进发行包。
exclude_filter="tests/*, tools/*, docs/*, scripts/*, shots/*"
export_path="build/ControllerTT.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
binary_format/architecture="x86_64"
; 把资源包塞进 exe 内部，产物就是单独一个可双击的文件，不用带 .pck。
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
; 只有调试构建才附带控制台版；发行版保持干净的单文件。
debug/export_console_wrapper=1
application/modify_resources=true
application/icon="res://icon.ico"
application/console_wrapper_icon="res://icon.ico"
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="ControllerTT"
application/product_name="ControllerTT 手柄摇杆训练器"
application/file_description="面向 FPS 的手柄摇杆熟练度训练工具"
application/copyright=""
application/trademarks=""
